function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}

function monday(s){var x=parseDate(s), k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return iso(x);}

function stats(list){var g=0,a=0,c=0;list.forEach(function(t){g+=+t.goal||0;a+=+t.actual||0;c+=+t.correct||0;});return {goal:g,actual:a,correct:c,acc:a?Math.round(c/a*100):0};}

}
function renderSubjects(){
 var ss=[];data.tasks.forEach(function(t){if(ss.indexOf(t.subject)<0)ss.push(t.subject);});
 document.getElementById('subjects').innerHTML='<div class="subjects">'+ss.map(function(s){var l=data.tasks.filter(function(t){return t.subject===s && t.date<='2026-11-25';}),z=stats(l);return '<div class="subject"><div class="section"><h3>'+dot(s)+esc(s)+'</h3><b>'+pct(l)+'%</b></div><div class="progress"><i style="width:'+pct(l)+'%;background:'+(colors[s]||'#aaa')+'"></i></div><div class="small" style="margin-top:7px">문제 '+z.actual+'/'+z.goal+' · 정답률 '+z.acc+'%</div></div>';}).join('')+'</div>';
}
function renderWrong(){
 var l=data.tasks.filter(function(t){return t.wrong;});
 document.getElementById('wrong').innerHTML='<div class="card"><div class="section"><h2>오답 복습 큐</h2><span>'+l.length+'개</span></div>'+(l.length?l.map(function(t){return '<div class="task"><div>❌</div><div><b>'+esc(t.title)+'</b><div class="small">'+fmt(t.date)+' · '+esc(t.note||'메모 없음')+'</div></div><div><button data-go="'+t.date+'">원래 날짜</button> <button data-act="clearwrong" data-id="'+t.id+'">복습 완료</button></div></div>';}).join(''):'<div class="small">오답 복습 항목이 없습니다.</div>')+'</div>';
}
function renderAll(){renderDashboard();renderDaily();renderWeekly();renderMonthly();renderSubjects();renderWrong();}
function activate(name){
 document.querySelectorAll('.page').forEach(function(x){x.classList.remove('active');});
 document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});
 var p=document.getElementById(name);if(p)p.classList.add('active');
 var t=document.querySelector('.tab[data-page="'+name+'"]');if(t)t.classList.add('active');
}

document.addEventListener('click',function(e){
 var tab=e.target.closest('.tab'); if(tab){e.preventDefault();activate(tab.dataset.page);location.hash=tab.dataset.page;return;}
 var go=e.target.closest('[data-go]'); if(go){data.selectedDate=go.dataset.go;persist();renderDaily();activate('daily');return;}
 var mv=e.target.closest('[data-monthview]'); if(mv){data.monthView=mv.dataset.monthview;persist();renderMonthly();return;}
 var mf=e.target.closest('[data-monthfocus]'); if(mf){data.monthFocus=mf.dataset.monthfocus;persist();renderMonthly();return;}
 var el=e.target.closest('[data-act]'); if(!el)return;
 var act=el.dataset.act,id=el.dataset.id,t=id?find(id):null;
 if(act==='toggle'&&t){t.status=t.status==='완료'?'예정':'완료';persist();renderAll();}
 else if(act==='edit'&&t){var a=prompt('실제로 푼 문제 수',t.actual||0);if(a===null)return;var c=prompt('맞은 문제 수',t.correct||0);if(c===null)return;var n=prompt('짧은 오답/학습 메모',t.note||'');if(n===null)n=t.note||'';t.actual=Math.max(0,+a||0);t.correct=Math.max(0,Math.min(+c||0,t.actual));t.note=n;t.wrong=confirm('오답 복습 큐에 넣을까요?');persist();renderAll();}
 else if(act==='tomorrow'&&t){t.date=clamp(addDays(t.date,1));t.status='이월';persist();renderAll();}
 else if(act==='move'&&t){var v=prompt('이동할 날짜 (YYYY-MM-DD)',t.date);if(v&&/^\d{4}-\d{2}-\d{2}$/.test(v)){t.date=clamp(v);t.status='이월';persist();renderAll();}}
 else if(act==='remove'&&t){if(confirm('삭제할까요?')){data.tasks=data.tasks.filter(function(x){return x.id!==id;});persist();renderAll();}}
 else if(act==='prev'){data.selectedDate=clamp(addDays(data.selectedDate,-1));persist();renderDaily();}
 else if(act==='next'){data.selectedDate=clamp(addDays(data.selectedDate,1));persist();renderDaily();}
 else if(act==='add'){var title=document.getElementById('newTitle').value.trim();if(!title)return alert('과제명을 입력해 주세요.');data.tasks.push({id:uid(),date:data.selectedDate,subject:document.getElementById('newSubject').value,title:title,status:'예정',goal:+document.getElementById('newGoal').value||0,actual:0,correct:0,wrong:false,note:''});persist();renderAll();}
 else if(act==='clearwrong'&&t){t.wrong=false;persist();renderAll();}
});
document.addEventListener('change',function(e){
 if(e.target.id==='datePick'){data.selectedDate=clamp(e.target.value);persist();renderDaily();}
 if(e.target.dataset.act==='status'){var t=find(e.target.dataset.id);if(t){t.status=e.target.value;persist();renderAll();}}
 if(e.target.dataset.week){data.weeklyGoals[e.target.dataset.week]=e.target.value;persist();renderDashboard();}
 if(e.target.dataset.month){data.monthlyGoals[e.target.dataset.month]=e.target.value;persist();renderDashboard();}
});
document.getElementById('importFile').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var x=JSON.parse(r.result);if(!x.tasks)throw new Error();data=x;persist();renderAll();alert('복원 완료');}catch(_){alert('올바른 백업 파일이 아닙니다.');}};r.readAsText(f);});
window.exportData=function(){var b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='임종평_스터디플래너_백업.json';a.click();setTimeout(function(){URL.revokeObjectURL(a.href);},1000);};
try{
 document.body.classList.add('js');
 renderAll();
 var initial=location.hash?location.hash.slice(1):'dashboard';activate(document.getElementById(initial)?initial:'dashboard');
}catch(err){
 var f=document.getElementById('fatal');f.style.display='block';f.textContent='초기화 오류: '+(err&&err.message?err.message:String(err));
 console.error(err);
}
})();
</script>
