var memoryOnly=false;

function safeClone(x){return JSON.parse(JSON.stringify(x));}
function load(){
  try{
    var raw=window.localStorage.getItem(KEY);
    return raw?JSON.parse(raw):safeClone(SEED);
  }catch(e){memoryOnly=true;return safeClone(SEED);}
}
var data=load();
function persist(){
  try{if(!memoryOnly)window.localStorage.setItem(KEY,JSON.stringify(data));}catch(e){memoryOnly=true;}
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}
function parseDate(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2],12,0,0);}
function iso(dt){return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');}
function addDays(s,n){var x=parseDate(s);x.setDate(x.getDate()+n);return iso(x);}
function clamp(s){return s<START?START:(s>END?END:s);}
function fmt(s){return parseDate(s).toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'});}
function monday(s){var x=parseDate(s), k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return iso(x);}
function tdate(s){return data.tasks.filter(function(t){return t.date===s;});}
function pct(list){if(!list.length)return 0;return Math.round(100*list.filter(function(t){return t.status==='완료';}).length/list.length);}
function stats(list){var g=0,a=0,c=0;list.forEach(function(t){g+=+t.goal||0;a+=+t.actual||0;c+=+t.correct||0;});return {goal:g,actual:a,correct:c,acc:a?Math.round(c/a*100):0};}
function uid(){return 'u_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);}
function dot(s){return '<span class="dot" style="background:'+(colors[s]||'#ddd')+'"></span>';}
function find(id){return data.tasks.find(function(t){return t.id===id;});}
function dday(){var now=new Date();now.setHours(12,0,0,0);return Math.ceil((parseDate(EXAM)-now)/86400000);}
function taskHtml(t){
 var ops=['예정','진행중','완료','이월','스킵'].map(function(x){return '<option '+(x===t.status?'selected':'')+'>'+x+'</option>';}).join('');
 var rate=t.actual?Math.round((t.correct||0)/t.actual*100):0;
 return '<div class="task">'+
  '<div class="check '+(t.status==='완료'?'done':'')+'" data-act="toggle" data-id="'+t.id+'">'+(t.status==='완료'?'✓':'')+'</div>'+
  '<div><b>'+dot(t.subject)+esc(t.title)+'</b><div>'+
  '<span class="badge">'+esc(t.subject)+'</span>'+(t.goal?'<span class="badge">목표 '+t.goal+'문제</span>':'')+
  (t.actual?'<span class="badge">실제 '+t.actual+' · '+rate+'%</span>':'')+(t.wrong?'<span class="badge">오답복습</span>':'')+
  '</div>'+(t.note?'<div class="small" style="margin-top:5px">📝 '+esc(t.note)+'</div>':'')+'</div>'+
  '<div class="actions"><select data-act="status" data-id="'+t.id+'">'+ops+'</select>'+
  '<button data-act="edit" data-id="'+t.id+'">기록</button><button data-act="tomorrow" data-id="'+t.id+'">내일 이월</button>'+
  '<button data-act="move" data-id="'+t.id+'">날짜 이동</button><button class="danger" data-act="remove" data-id="'+t.id+'">삭제</button></div></div>';
}
function renderDashboard(){
 var today='2026-09-10';
 var real=iso(new Date()); if(real>=START && real<=END)today=real;
 var list=tdate(today), all=data.tasks.filter(function(t){return t.date<='2026-11-25';}), wk=monday(today),
     wlist=data.tasks.filter(function(t){return t.date>=wk && t.date<=addDays(wk,6);}), z=stats(all);
 var ss=[];data.tasks.forEach(function(t){if(ss.indexOf(t.subject)<0)ss.push(t.subject);});
 document.getElementById('dashboard').innerHTML=
 '<div class="grid"><div class="card c4"><div class="small">'+fmt(today)+'</div><div class="metric">D-'+Math.max(dday(),0)+'</div><div class="small">임종평 1일차 11/26</div></div>'+
 '<div class="card c4"><div class="small">전체 진도</div><div class="metric">'+pct(all)+'%</div><div class="progress"><i style="width:'+pct(all)+'%"></i></div></div>'+
 '<div class="card c4"><div class="small">누적 문제 / 정답률</div><div class="metric">'+z.actual+' / '+z.acc+'%</div><div class="small">목표 '+z.goal+'문제</div></div>'+
 '<div class="card c8"><div class="section"><h2>오늘 할 일</h2><button data-go="'+today+'">Daily 열기</button></div>'+(list.length?list.map(taskHtml).join(''):'<div class="small">오늘 등록된 과제가 없습니다.</div>')+'</div>'+
 '<div class="card c4"><h3>이번 주 목표</h3><p>'+esc(data.weeklyGoals[wk]||'목표를 입력해 주세요.')+'</p><b>'+pct(wlist)+'%</b><div class="progress"><i style="width:'+pct(wlist)+'%"></i></div></div>'+
 '<div class="card c12"><div class="section"><h2>과목별 진도</h2></div><div class="subjects">'+ss.map(function(s){var l=all.filter(function(t){return t.subject===s;}),q=stats(l);return '<div class="subject"><b>'+dot(s)+esc(s)+'</b><div class="progress" style="margin:8px 0"><i style="width:'+pct(l)+'%;background:'+(colors[s]||'#aaa')+'"></i></div><div class="small">진도 '+pct(l)+'% · 정답률 '+q.acc+'%</div></div>';}).join('')+'</div></div></div>';
}
function renderDaily(){
 var s=data.selectedDate||START,list=tdate(s),z=stats(list);
 document.getElementById('daily').innerHTML='<div class="card"><div class="section"><div><h2>'+fmt(s)+'</h2><div class="small">'+list.length+'개 · 달성 '+pct(list)+'% · '+z.actual+'/'+z.goal+'문제</div></div>'+
 '<div><button data-act="prev">◀</button> <input id="datePick" type="date" min="'+START+'" max="'+END+'" value="'+s+'"> <button data-act="next">▶</button></div></div>'+
 (list.length?list.map(taskHtml).join(''):'<div class="small">이 날짜에는 계획이 없습니다.</div>')+'</div>'+
 '<div class="card"><div class="section"><h3>과제 추가</h3></div><div class="form"><input id="newTitle" placeholder="과제명"><select id="newSubject">'+Object.keys(colors).map(function(x){return '<option>'+x+'</option>';}).join('')+'</select><input id="newGoal" type="number" min="0" placeholder="목표 문제수"><button class="primary" data-act="add">추가</button></div></div>';
}
function renderWeekly(){
 var weeks=[];for(var s=monday(START);s<=END;s=addDays(s,7))weeks.push(s);
 document.getElementById('weekly').innerHTML='<div class="grid">'+weeks.map(function(w){var l=data.tasks.filter(function(t){return t.date>=w && t.date<=addDays(w,6);}),z=stats(l);return '<div class="card c6"><div class="section"><h3>'+fmt(w)+' 주</h3><b>'+pct(l)+'%</b></div><textarea data-week="'+w+'">'+esc(data.weeklyGoals[w]||'')+'</textarea><div class="progress" style="margin:9px 0"><i style="width:'+pct(l)+'%"></i></div><div class="small">'+l.filter(function(t){return t.status==='완료';}).length+'/'+l.length+'개 완료 · 문제 '+z.actual+'/'+z.goal+' · 정답률 '+z.acc+'%</div></div>';}).join('')+'</div>';
}
function renderMonthly(){
 document.getElementById('monthly').innerHTML='<div class="grid">'+['2026-09','2026-10','2026-11'].map(function(m){var l=data.tasks.filter(function(t){return t.date.indexOf(m)===0 && t.date<='2026-11-25';}),z=stats(l);return '<div class="card c12"><div class="section"><h2>'+m.replace('-','년 ')+'월</h2><b>'+pct(l)+'%</b></div><textarea data-month="'+m+'">'+esc(data.monthlyGoals[m]||'')+'</textarea><div class="progress" style="margin:9px 0"><i style="width:'+pct(l)+'%"></i></div><div class="small">'+l.filter(function(t){return t.status==='완료';}).length+'/'+l.length+'개 완료 · '+z.actual+'문제 · 정답률 '+z.acc+'%</div></div>';}).join('')+'</div>';
}
function renderSubjects(){
 var ss=[];data.tasks.forEach(function(t){if(ss.indexOf(t.subject)<0)ss.push(t.subject);});
 document.getElementById('subjects').innerHTML='<div class="subjects">'+ss.map(function(s){var l=data.tasks.filter(function(t){return t.subject===s && t.date<='2026-11-25';}),z=stats(l);return '<div class="subject"><div class="section"><h3>'+dot(s)+esc(s)+'</h3><b>'+pct(l)+'%</b></div><div class="progress"><i style="width:'+pct(l)+'%;background:'+(colors[s]||'#aaa')+'"></i></div><div class="small" style="margin-top:7px">문제 '+z.actual+'/'+z.goal+' · 정답률 '+z.acc+'%</div></div>';}).join('')+'</div>';
}
function renderWrong(){
 var l=data.tasks.filter(function(t){return t.wrong;});
 document.getElementById('wrong').innerHTML='<div class="card"><div class="section"><h2>오답 복습 큐</h2><span>'+l.length+'개</span></div>'+(l.length?l.map(function(t){return '<div class="task"><div>❌</div><div><b>'+esc(t.title)+'</b><div class="small">'+fmt(t.date)+' · '+esc(t.note||'메모 없음')+'</div></div><div><button data-go="'+t.date+'">원래 날짜</button> <button data-act="clearwrong" data-id="'+t.id+'">복습 완료</button></div></div>';}).join(''):'<div class="small">오답 복습 항목이 없습니다.</div>')+'</div>';
}
function renderAll(){renderDashboard();renderDaily();renderWeekly();renderMonthly();renderSubjects();renderWrong();}
function activate(name){
 document.querySelectorAll('.page').forEach(function(x){x.classList.remove('active');});
 document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});
 var p=document.getElementById(name);if(p)p.classList.add('active');
 var t=document.querySelector('.tab[data-page="'+name+'"]');if(t)t.classList.add('active');
}

document.addEventListener('click',function(e){
 var tab=e.target.closest('.tab'); if(tab){e.preventDefault();activate(tab.dataset.page);location.hash=tab.dataset.page;return;}
 var go=e.target.closest('[data-go]'); if(go){data.selectedDate=go.dataset.go;persist();renderDaily();activate('daily');return;}
 var el=e.target.closest('[data-act]'); if(!el)return;
 var act=el.dataset.act,id=el.dataset.id,t=id?find(id):null;
 if(act==='toggle'&&t){t.status=t.status==='완료'?'예정':'완료';persist();renderAll();}
 else if(act==='edit'&&t){var a=prompt('실제로 푼 문제 수',t.actual||0);if(a===null)return;var c=prompt('맞은 문제 수',t.correct||0);if(c===null)return;var n=prompt('짧은 오답/학습 메모',t.note||'');if(n===null)n=t.note||'';t.actual=Math.max(0,+a||0);t.correct=Math.max(0,Math.min(+c||0,t.actual));t.note=n;t.wrong=confirm('오답 복습 큐에 넣을까요?');persist();renderAll();}
 else if(act==='tomorrow'&&t){t.date=clamp(addDays(t.date,1));t.status='이월';persist();renderAll();}
 else if(act==='move'&&t){var v=prompt('이동할 날짜 (YYYY-MM-DD)',t.date);if(v&&/^\d{4}-\d{2}-\d{2}$/.test(v)){t.date=clamp(v);t.status='이월';persist();renderAll();}}
 else if(act==='remove'&&t){if(confirm('삭제할까요?')){data.tasks=data.tasks.filter(function(x){return x.id!==id;});persist();renderAll();}}
 else if(act==='prev'){data.selectedDate=clamp(addDays(data.selectedDate,-1));persist();renderDaily();}
 else if(act==='next'){data.selectedDate=clamp(addDays(data.selectedDate,1));persist();renderDaily();}
 else if(act==='add'){var title=document.getElementById('newTitle').value.trim();if(!title)return alert('과제명을 입력해 주세요.');data.tasks.push({id:uid(),date:data.selectedDate,subject:document.getElementById('newSubject').value,title:title,status:'예정',goal:+document.getElementById('newGoal').value||0,actual:0,correct:0,wrong:false,note:''});persist();renderAll();}
 else if(act==='clearwrong'&&t){t.wrong=false;persist();renderAll();}
});
document.addEventListener('change',function(e){
 if(e.target.id==='datePick'){data.selectedDate=clamp(e.target.value);persist();renderDaily();}
 if(e.target.dataset.act==='status'){var t=find(e.target.dataset.id);if(t){t.status=e.target.value;persist();renderAll();}}
 if(e.target.dataset.week){data.weeklyGoals[e.target.dataset.week]=e.target.value;persist();renderDashboard();}
 if(e.target.dataset.month){data.monthlyGoals[e.target.dataset.month]=e.target.value;persist();renderDashboard();}
});
document.getElementById('importFile').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var x=JSON.parse(r.result);if(!x.tasks)throw new Error();data=x;persist();renderAll();alert('복원 완료');}catch(_){alert('올바른 백업 파일이 아닙니다.');}};r.readAsText(f);});
window.exportData=function(){var b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='임종평_스터디플래너_백업.json';a.click();setTimeout(function(){URL.revokeObjectURL(a.href);},1000);};
try{
 document.body.classList.add('js');
 renderAll();
 var initial=location.hash?location.hash.slice(1):'dashboard';activate(document.getElementById(initial)?initial:'dashboard');
}catch(err){
 var f=document.getElementById('fatal');f.style.display='block';f.textContent='초기화 오류: '+(err&&err.message?err.message:String(err));
 console.error(err);
}
})();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
</script>
